<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LatAm Spanish</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4efe6;
    --ink: #1c1915;
    --muted: #6e675c;
    --line: #e4daca;
    --card: #fffaf3;
    --accent: #c4512c;
    --accent-ink: #fff8f3;
    --chip: #efe6d8;
    --ok: #1f7a45;
    --ok-bg: #e5f4ea;
    --mid: #9a6b12;
    --mid-bg: #f8efd4;
    --bad: #a33b32;
    --bad-bg: #f8e6e3;
    --shadow: 0 10px 30px rgba(60, 40, 20, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16130f;
      --ink: #f3ecdf;
      --muted: #b3a894;
      --line: #3a3228;
      --card: #221c16;
      --accent: #e07a52;
      --accent-ink: #1c120e;
      --chip: #2c261f;
      --ok: #8ddeaf;
      --ok-bg: #1c3326;
      --mid: #e6c56a;
      --mid-bg: #3a3018;
      --bad: #f0a8a2;
      --bad-bg: #3a2220;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 42rem; padding: 1.1rem 1rem 2rem;
    font: 16px/1.45 "Iowan Old Style", Palatino, Georgia, serif;
    background: var(--bg); color: var(--ink);
  }
  h1 { font-size: 1.35rem; letter-spacing: -.02em; margin: 0; }
  header p, .meta, .hint, footer { color: var(--muted); }
  header p { margin: .2rem 0 0; font-size: .92rem; }
  .top { display: flex; justify-content: space-between; gap: .75rem; align-items: start; }
  .lang {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: .35rem .7rem; font: inherit; cursor: pointer;
  }
  .status {
    margin: .85rem 0 .55rem; font-variant-numeric: tabular-nums;
    font-size: .95rem;
  }
  .chips, nav, .grade, .stepper { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
  nav { margin: .8rem 0 1rem; }
  button, .chip {
    font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    border-radius: 999px; padding: .4rem .75rem; cursor: pointer;
  }
  button.on, .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 1.15rem 1.15rem 1rem; box-shadow: var(--shadow); min-height: 11rem;
  }
  .lemma { font-size: 2.35rem; line-height: 1.1; margin: .35rem 0; }
  .pill {
    display: inline-block; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase;
    border-radius: 999px; padding: .15rem .5rem; background: var(--chip);
  }
  .gloss { font-size: 1.15rem; margin: .4rem 0; }
  .sentence { margin: .7rem 0 0; padding-top: .7rem; border-top: 1px solid var(--line); }
  .grade { margin-top: .85rem; }
  .grade button { min-width: 6.2rem; }
  .again { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
  .hard { background: var(--mid-bg); color: var(--mid); border-color: transparent; }
  .good { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  input[type=text], input[type=number] {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: .55rem .7rem; width: 100%;
  }
  input[type=number] { width: 5rem; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  td, th { border-bottom: 1px solid var(--line); text-align: left; padding: .35rem .2rem; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  footer { margin-top: 1.5rem; font-size: .78rem; }
  footer a { color: inherit; }
  .panel { display: grid; gap: .7rem; }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1 id="title">西语词表</h1>
    <p id="subtitle"></p>
  </div>
  <button class="lang" id="lang" type="button">EN</button>
</header>
<p class="status" id="status"></p>
<div class="chips" id="levels"></div>
<div class="chips" id="quick" style="margin-top:.45rem"></div>
<nav id="nav"></nav>
<section id="app"></section>
<footer id="foot"></footer>
<script>
const I18N = {
  zh: {
    title: "西语词表",
    subtitle: "拉美五人称。等级是词频估算，不是塞万提斯考纲。",
    review: "认词", dict: "听写", conj: "变位", browse: "浏览", settings: "设置",
    today: "今日新词", range: "等级", accentLoose: "重音宽松", accentStrict: "严格重音",
    flip: "翻面", again: "不认识", hard: "模糊", good: "认识",
    think: "先想释义，再翻面", noGloss: "（无释义）",
    check: "检查", skip: "跳过", next: "下一题",
    typeLemma: "西语词元", typeForm: "变位",
    right: "对", answer: "是", accept: "接受",
    empty: "这个范围内没有可练的词。点上面的等级放宽，或确认构建已合并释义。",
    noConj: "这个词没有可用的拉美变位。",
    search: "搜索词元", word: "词", level: "等级", gloss: "释义",
    newPerDay: "每日新词", reviewCap: "复习上限", save: "保存",
    expSet: "导出设置", impSet: "导入设置", expProg: "导出进度", impProg: "导入进度",
    recorded: "已记录", localOnly: "条。进度和设置只在这台浏览器。",
    noun: "名词", verb: "动词", adj: "形容词", adv: "副词", rank: "排名",
    t: {pres:"现在时", impf:"未完成过去", fut:"将来时", cond:"条件式", "subj.pres":"虚拟现在", "subj.impf":"虚拟未完成", "subj.fut":"虚拟将来", imp:"命令式", ger:"副动词", part:"过去分词"},
    foot: "词表为改编作品。署名与改动说明见 NOTICE.md。未获上游背书。"
  },
  en: {
    title: "LatAm Spanish",
    subtitle: "Five LatAm persons. Levels are frequency estimates, not Instituto Cervantes.",
    review: "Recall", dict: "Dictation", conj: "Conjugation", browse: "Browse", settings: "Settings",
    today: "New today", range: "Level", accentLoose: "Loose accents", accentStrict: "Strict accents",
    flip: "Show", again: "Again", hard: "Fuzzy", good: "Known",
    think: "Recall the gloss, then flip.", noGloss: "(no gloss)",
    check: "Check", skip: "Skip", next: "Next",
    typeLemma: "Spanish lemma", typeForm: "Conjugation",
    right: "Yes", answer: "It is", accept: "Accepted",
    empty: "Nothing to study in this range. Widen the levels above, or rebuild so glosses are merged.",
    noConj: "No LatAm paradigm for this verb.",
    search: "Search lemma", word: "Word", level: "Level", gloss: "Gloss",
    newPerDay: "New words / day", reviewCap: "Review cap", save: "Save",
    expSet: "Export settings", impSet: "Import settings", expProg: "Export progress", impProg: "Import progress",
    recorded: "Stored", localOnly: "cards. Progress and settings stay in this browser.",
    noun: "noun", verb: "verb", adj: "adjective", adv: "adverb", rank: "rank",
    t: {pres:"present", impf:"imperfect", fut:"future", cond:"conditional", "subj.pres":"present subjunctive", "subj.impf":"imperfect subjunctive", "subj.fut":"future subjunctive", imp:"imperative", ger:"gerund", part:"participle"},
    foot: "Adapted dataset. Attribution and changes are in NOTICE.md. Not endorsed by upstream."
  }
};
const PERSONS = {"1sg":"yo","2sg":"tú","3sg":"usted / él / ella","1pl":"nosotros","3pl":"ustedes", ger:"gerund", part:"participle"};
const LEVELS = ["A1","A2","B1","B2","C1","C2"];
const VIEWS = ["review","dict","conj","browse","settings"];

const settings = Object.assign({
  newPerDay: 15, reviewCap: 40, cefrFrom: "A2", cefrTo: "B1", strictAccent: false, lang: ""
}, JSON.parse(localStorage.getItem("esvocab-settings") || "{}"));
let progress = JSON.parse(localStorage.getItem("esvocab-progress") || "{}");
let day = JSON.parse(localStorage.getItem("esvocab-day") || "{}");
let vocab = [], sentences = {}, view = "review", card = null, revealed = false, rangeAnchor = null;

function lang() {
  if (settings.lang === "en" || settings.lang === "zh") return settings.lang;
  return (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
}
function t(key) { return I18N[lang()][key]; }
function save() {
  localStorage.setItem("esvocab-settings", JSON.stringify(settings));
  localStorage.setItem("esvocab-progress", JSON.stringify(progress));
  localStorage.setItem("esvocab-day", JSON.stringify(day));
}
function fold(s) {
  s = (s || "").toLowerCase().trim();
  if (settings.strictAccent) return s;
  return s.replace(/[áà]/g,"a").replace(/[éè]/g,"e").replace(/[íì]/g,"i").replace(/[óò]/g,"o").replace(/[úùü]/g,"u");
}
function today() { return new Date().toISOString().slice(0,10); }
function addDays(n) { const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function ensureDay() { if (day.date !== today()) day = {date: today(), introduced: 0}; }
function inRange(level) {
  return LEVELS.indexOf(level) >= LEVELS.indexOf(settings.cefrFrom)
    && LEVELS.indexOf(level) <= LEVELS.indexOf(settings.cefrTo);
}
function art(item) {
  if (item.pos !== "NOUN" || !item.gender) return "";
  return item.gender === "f" ? "la " : "el ";
}
function posLabel(pos) {
  if (pos === "NOUN") return t("noun");
  if (pos === "ADJ") return t("adj");
  if (pos === "ADV") return t("adv");
  return t("verb");
}
function dueQueue() {
  ensureDay();
  const pool = vocab.filter(v => inRange(v.cefr) && v.gloss);
  const review = pool.filter(v => progress[v.id] && progress[v.id].due <= today());
  const fresh = pool.filter(v => !progress[v.id]).sort((a,b) => a.rank - b.rank);
  const room = Math.max(0, settings.newPerDay - day.introduced);
  return review.slice(0, settings.reviewCap).concat(fresh.slice(0, room));
}
function grade(id, kind, isNew) {
  ensureDay();
  const prev = progress[id] || {step: 0};
  let step = prev.step || 0, days = 1;
  if (kind === "again") { step = 0; days = 1; }
  else if (kind === "hard") days = 3;
  else { step += 1; days = [1,4,10,25][Math.min(step, 3)]; }
  if (isNew) day.introduced += 1;
  progress[id] = {step, due: addDays(days), last: kind, seen: today()};
  save();
}
function promptConj(item) {
  const options = [];
  for (const [tense, persons] of Object.entries(item.paradigms || {})) {
    for (const [person, forms] of Object.entries(persons)) {
      if (forms && forms.length) options.push({tense, person, forms});
    }
  }
  return options.length ? options[Math.floor(Math.random()*options.length)] : null;
}
function download(name, obj) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"}));
  a.download = name; a.click();
}
function pickFile(done) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json";
  inp.onchange = () => {
    const reader = new FileReader();
    reader.onload = () => done(JSON.parse(reader.result));
    reader.readAsText(inp.files[0]);
  };
  inp.click();
}
function setLevel(level) {
  if (!rangeAnchor || rangeAnchor === level) {
    settings.cefrFrom = settings.cefrTo = level;
    rangeAnchor = level;
  } else {
    const a = LEVELS.indexOf(rangeAnchor), b = LEVELS.indexOf(level);
    settings.cefrFrom = LEVELS[Math.min(a,b)];
    settings.cefrTo = LEVELS[Math.max(a,b)];
    rangeAnchor = null;
  }
  save(); card = null; revealed = false; paint();
}
function paintChrome() {
  const L = lang();
  document.documentElement.lang = L === "zh" ? "zh-Hans" : "en";
  document.getElementById("title").textContent = t("title");
  document.getElementById("subtitle").textContent = t("subtitle");
  document.getElementById("lang").textContent = L === "zh" ? "EN" : "中文";
  ensureDay();
  document.getElementById("status").textContent =
    `${settings.cefrFrom}–${settings.cefrTo} · ${t("today")} ${day.introduced}/${settings.newPerDay}`;
  document.getElementById("levels").innerHTML = LEVELS.map(level =>
    `<button class="chip ${inRange(level)?"on":""}" data-level="${level}">${level}</button>`).join("");
  document.getElementById("levels").querySelectorAll("[data-level]").forEach(btn =>
    btn.onclick = () => setLevel(btn.dataset.level));
  document.getElementById("quick").innerHTML = `
    <span class="meta">${t("newPerDay")}</span>
    <button id="minus" type="button">−</button>
    <strong>${settings.newPerDay}</strong>
    <button id="plus" type="button">+</button>
    <button id="accent" class="${settings.strictAccent?"on":""}" type="button">${settings.strictAccent?t("accentStrict"):t("accentLoose")}</button>`;
  document.getElementById("minus").onclick = () => { settings.newPerDay = Math.max(1, settings.newPerDay-5); save(); card=null; paint(); };
  document.getElementById("plus").onclick = () => { settings.newPerDay = Math.min(100, settings.newPerDay+5); save(); card=null; paint(); };
  document.getElementById("accent").onclick = () => { settings.strictAccent = !settings.strictAccent; save(); paint(); };
  document.getElementById("nav").innerHTML = VIEWS.map(v =>
    `<button data-view="${v}" class="${v===view?"on":""}">${t(v)}</button>`).join("");
  document.getElementById("nav").querySelectorAll("[data-view]").forEach(btn => btn.onclick = () => {
    view = btn.dataset.view; card = null; revealed = false; paint();
  });
  document.getElementById("foot").innerHTML = `${t("foot")}
    <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC-BY-SA 4.0</a>.
    <a href="https://github.com/natema/wordhoard">wordhoard</a>,
    <a href="https://kaikki.org">kaikki</a>,
    <a href="https://github.com/hermitdave/FrequencyWords">FrequencyWords</a>,
    <a href="https://github.com/doozan/spanish_data">doozan</a>,
    <a href="https://tatoeba.org">Tatoeba</a>
    <a href="https://creativecommons.org/licenses/by/2.0/fr/deed.en">CC-BY 2.0 FR</a>.
    <a href="NOTICE.md">NOTICE.md</a>`;
}
function paint() {
  paintChrome();
  const app = document.getElementById("app");
  if (view === "settings") return renderSettings(app);
  if (view === "browse") return renderBrowse(app);
  if (!card) card = nextCard();
  if (!card) { app.innerHTML = `<div class="card"><p>${t("empty")}</p></div>`; return; }
  if (view === "review") renderReview(app);
  else if (view === "dict") renderDict(app);
  else renderConj(app);
}
function nextCard() {
  if (view === "conj") {
    const verbs = vocab.filter(v => v.paradigms && Object.keys(v.paradigms).length && inRange(v.cefr));
    if (!verbs.length) return null;
    const item = verbs[Math.floor(Math.random()*Math.min(verbs.length, 400))];
    return {item, conj: promptConj(item), isNew: false};
  }
  const q = dueQueue();
  if (!q.length) return null;
  return {item: q[0], conj: null, isNew: !progress[q[0].id]};
}
function renderReview(app) {
  const item = card.item;
  const sents = sentences[item.id] || [];
  app.innerHTML = `<div class="card">
    <span class="pill">${posLabel(item.pos)} · ${item.cefr}</span>
    <div class="lemma">${art(item)}${item.lemma}</div>
    <div class="meta">${t("rank")} ${item.rank}</div>
    ${revealed ? `<p class="gloss">${item.gloss || t("noGloss")}</p>${sents.map(s => `<p class="sentence">${s.es}<br><span class="meta">${s.en}</span></p>`).join("")}` : `<p class="hint">${t("think")}</p>`}
  </div>
  <div class="grade">
    ${revealed ? "" : `<button class="primary" id="show">${t("flip")}</button>`}
    <button class="again" data-g="again">${t("again")}</button>
    <button class="hard" data-g="hard">${t("hard")}</button>
    <button class="good" data-g="good">${t("good")}</button>
  </div>`;
  const show = document.getElementById("show");
  if (show) show.onclick = () => { revealed = true; paint(); };
  app.querySelectorAll("[data-g]").forEach(btn => btn.onclick = () => {
    grade(item.id, btn.dataset.g, card.isNew); revealed = false; card = null; paint();
  });
}
function renderDict(app) {
  const item = card.item;
  app.innerHTML = `<div class="card">
    <span class="pill">${posLabel(item.pos)} · ${item.cefr}</span>
    <p class="gloss">${item.gloss || t("noGloss")}</p>
    <p><input id="ans" type="text" placeholder="${t("typeLemma")}" autocomplete="off"></p>
    <p id="msg"></p>
  </div>
  <div class="grade"><button class="primary" id="check">${t("check")}</button><button id="skip">${t("skip")}</button></div>`;
  const ans = document.getElementById("ans");
  ans.focus();
  document.getElementById("check").onclick = () => {
    const ok = fold(ans.value) === fold(item.lemma);
    document.getElementById("msg").innerHTML = ok
      ? `<span class="ok">${t("right")}. ${item.lemma}</span>`
      : `<span class="bad">${t("answer")} ${item.lemma}</span>`;
    grade(item.id, ok ? "good" : "again", card.isNew);
    setTimeout(() => { card = null; paint(); }, 700);
  };
  ans.onkeydown = e => { if (e.key === "Enter") document.getElementById("check").click(); };
  document.getElementById("skip").onclick = () => { card = null; paint(); };
}
function renderConj(app) {
  const item = card.item, conj = card.conj;
  if (!conj) { app.innerHTML = `<div class="card"><p>${t("noConj")}</p></div>`; return; }
  const tense = I18N[lang()].t[conj.tense] || conj.tense;
  app.innerHTML = `<div class="card">
    <span class="pill">${tense}</span>
    <div class="lemma">${item.lemma}</div>
    <div class="meta">${PERSONS[conj.person] || conj.person}</div>
    <p><input id="ans" type="text" placeholder="${t("typeForm")}" autocomplete="off"></p>
    <p id="msg"></p>
  </div>
  <div class="grade"><button class="primary" id="check">${t("check")}</button><button id="skip">${t("next")}</button></div>`;
  const ans = document.getElementById("ans");
  ans.focus();
  document.getElementById("check").onclick = () => {
    const ok = conj.forms.some(f => fold(f) === fold(ans.value));
    document.getElementById("msg").innerHTML = ok
      ? `<span class="ok">${t("right")}. ${conj.forms[0]}</span>`
      : `<span class="bad">${t("accept")}: ${conj.forms.join(" / ")}</span>`;
  };
  ans.onkeydown = e => { if (e.key === "Enter") document.getElementById("check").click(); };
  document.getElementById("skip").onclick = () => { card = null; paint(); };
}
function renderBrowse(app) {
  const q = (document.getElementById("q") || {}).value || "";
  const rows = vocab.filter(v => !q || v.lemma.includes(q.toLowerCase())).slice(0, 80);
  app.innerHTML = `<p><input id="q" type="text" placeholder="${t("search")}" value="${q.replace(/"/g,""")}"></p>
    <table><tr><th>${t("word")}</th><th>${t("level")}</th><th>${t("gloss")}</th></tr>
    ${rows.map(v => `<tr><td>${art(v)}${v.lemma}</td><td>${v.cefr}</td><td>${v.gloss || ""}</td></tr>`).join("")}
    </table>`;
  document.getElementById("q").oninput = () => renderBrowse(app);
}
function renderSettings(app) {
  app.innerHTML = `<div class="panel">
    <p>${t("reviewCap")} <input id="cap" type="number" min="1" max="200" value="${settings.reviewCap}"></p>
    <p><button class="primary" id="save">${t("save")}</button></p>
    <p>
      <button id="expSet">${t("expSet")}</button>
      <button id="impSet">${t("impSet")}</button>
      <button id="expProg">${t("expProg")}</button>
      <button id="impProg">${t("impProg")}</button>
    </p>
    <p class="meta">${t("recorded")} ${Object.keys(progress).length} ${t("localOnly")}</p>
  </div>`;
  document.getElementById("save").onclick = () => {
    settings.reviewCap = +document.getElementById("cap").value || 40;
    save(); paint();
  };
  document.getElementById("expSet").onclick = () => download("esvocab-settings.json", settings);
  document.getElementById("impSet").onclick = () => pickFile(obj => { Object.assign(settings, obj); save(); card=null; paint(); });
  document.getElementById("expProg").onclick = () => download("esvocab-progress.json", progress);
  document.getElementById("impProg").onclick = () => pickFile(obj => { progress = obj; save(); paint(); });
}
document.getElementById("lang").onclick = () => {
  settings.lang = lang() === "zh" ? "en" : "zh";
  save(); paint();
};
Promise.all([
  fetch("vocab.json").then(r => r.json()),
  fetch("sentences.json").then(r => r.json()).catch(() => ({}))
]).then(([v, s]) => {
  vocab = v.items || [];
  sentences = s || {};
  paint();
}).catch(() => {
  document.getElementById("app").textContent = "vocab.json missing. Serve dist/ over http.";
});
</script>
</body>
</html>
